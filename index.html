<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NurseNovate: The Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--card:#FFFFFF;--ink:#0F2E2D;--muted:#566E6C;--teal:#145C5A;--teal-d:#0E4644;--tint:#EEF2F2;--amber:#E4B653;--line:#D5DCDB;--green:#4C8C58;--ok:#3F7D4B;--accent:#F21B3F;--red:#C8161D;--redt:#C8161D;--bad:#C8161D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1F1E;--card:#112B2A;--ink:#EAF3F2;--muted:#9DB5B3;--teal:#5DB7B1;--teal-d:#93D6D1;--tint:#18403E;--line:#2A5755;--redt:#FF8A8F}}
:root[data-theme="dark"]{--bg:#0B1F1E;--card:#112B2A;--ink:#EAF3F2;--muted:#9DB5B3;--teal:#5DB7B1;--teal-d:#93D6D1;--tint:#18403E;--line:#2A5755;--redt:#FF8A8F}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;min-height:100%;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'Bricolage Grotesque','Public Sans',system-ui,sans-serif;line-height:1.1;margin:0}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px}
.big{font-size:3rem;line-height:1}
.btn{display:inline-block;background:var(--teal);color:#fff;border:0;border-radius:14px;padding:14px 22px;font:700 1.05rem 'Public Sans',sans-serif;cursor:pointer;text-decoration:none;text-align:center;margin:3px 4px 3px 0}
.btn.ghost{background:transparent;color:var(--teal-d);border:2px solid var(--teal)}
.btn.gold{background:var(--amber);color:#3b2600}
.btn.block{display:block;width:100%;margin:8px 0 0}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.muted{color:var(--muted);font-size:.92rem}
.hero{text-align:center;padding:30px 20px;border-top:4px solid var(--accent)}
.hero h1{font-size:2.2rem;font-weight:800;letter-spacing:-.02em;margin:10px 0 8px}
.how{text-align:left;margin:14px 0;padding:0;list-style:none}
.how li{padding:6px 0;font-size:.95rem}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.prog,.timer{height:8px;background:var(--tint);border-radius:8px;overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;background:var(--teal);border-radius:8px;transition:width .3s}
.timer{height:10px;margin-bottom:14px}.timer i{display:block;height:100%;width:100%;background:var(--amber);border-radius:10px}
.tag{display:inline-block;background:var(--tint);color:var(--teal-d);border-radius:20px;padding:2px 10px;font-size:.78rem;font-weight:700}
.q{font-size:1.3rem;font-weight:700;margin:8px 0 16px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px;font:500 1rem 'Public Sans',sans-serif;cursor:pointer;transition:transform .12s,background .2s,opacity .2s}
.opt:active{transform:scale(.97)}
.opt.picked{background:var(--teal);color:#fff;border-color:var(--teal)}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{opacity:.3;cursor:default}
.pu{display:flex;gap:8px;margin-top:4px}
.pu button{flex:1;background:var(--tint);color:var(--teal-d);border:0;border-radius:12px;padding:10px;font:700 .85rem 'Public Sans',sans-serif;cursor:pointer}
.pu button:disabled{opacity:.4}
.rev{animation:rise .35s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rev h2{font-size:1.5rem;margin-bottom:8px}
.ins{background:var(--tint);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:.97rem}
.word{border-left:5px solid var(--amber);padding:6px 12px;margin:10px 0;font-size:.93rem}
.res{text-align:center;animation:rise .5s both}
.res h2{font-size:1.9rem;margin:8px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.chip{background:var(--tint);color:var(--teal-d);border-radius:20px;padding:4px 12px;font-size:.85rem;font-weight:600}
.kv{text-align:left;margin-top:10px}.kv b{display:block;color:var(--teal-d);font-size:.85rem}
.stats{display:flex;gap:8px;margin:12px 0}
.stats div{flex:1;background:var(--tint);border-radius:14px;padding:10px 4px;font-size:.78rem;color:var(--muted)}
.stats b{display:block;font-size:1.3rem;color:var(--ink);font-family:'Bricolage Grotesque',sans-serif}
.row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.88rem}
.row span:first-child{width:150px;flex:none}
.row .b{flex:1;height:10px;background:var(--tint);border-radius:10px;overflow:hidden}
.row .b i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green),var(--amber));border-radius:10px;transition:width .9s .2s}
details summary{cursor:pointer;font:700 1.1rem 'Bricolage Grotesque',sans-serif}
details dl{margin:10px 0 0}details dt{font-weight:700;color:var(--teal-d);margin-top:8px}details dd{margin:0;font-size:.92rem}
.locked{position:relative;margin-top:10px}
.locked ul{filter:blur(5px);margin:0;padding-left:20px;user-select:none}
.locked .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700}
.sp{border:2px dashed var(--amber)}
.aff a{display:block;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;margin-top:8px;color:var(--ink);text-decoration:none;font-weight:600}
.small{font-size:.78rem;color:var(--muted);margin-top:10px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-90px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-weight:700;transition:transform .3s;z-index:9;text-align:center;max-width:90vw}
#toast.show{transform:translate(-50%,0)}
#conf{position:fixed;inset:0;pointer-events:none;z-index:8}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;justify-content:flex-start}
.pills button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 12px;font:600 .82rem 'Public Sans',sans-serif;cursor:pointer}
.pills button[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tabs button{flex:none;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:7px 12px;font:600 .85rem 'Public Sans',sans-serif;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--amber);color:#3b2600;border-color:var(--amber)}
.panel{background:var(--tint);border-radius:14px;padding:12px 14px;margin-top:8px;min-height:64px}
.mode{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;cursor:pointer;font:inherit}
.mode:active{transform:scale(.98)}
.mode .me{font-size:2.2rem}.mode b{display:block;font:700 1.15rem 'Bricolage Grotesque',sans-serif}.mode small{display:block;color:var(--muted);font-size:.88rem}
.back{background:none;border:0;color:var(--teal-d);font:700 .95rem 'Public Sans',sans-serif;cursor:pointer;padding:4px 0 10px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit}
.hall{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px 12px;border-radius:20px;background:linear-gradient(var(--tint),var(--card));border:1px solid var(--line)}
.door{position:relative;border:3px solid var(--teal);border-radius:60px 60px 8px 8px;background:var(--card);color:var(--ink);padding:22px 8px 14px;text-align:center;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:150px;justify-content:center}
.door .knob{position:absolute;right:12px;top:58%;width:10px;height:10px;border-radius:50%;background:var(--amber)}
.door .de{font-size:2.1rem}.door b{font-size:.92rem;line-height:1.2}.door small{color:var(--muted);font-size:.78rem}
.door.locked{border-style:dashed;border-color:var(--line);opacity:.6;background:var(--bg)}
.door.open{box-shadow:0 6px 16px rgba(20,92,90,.25)}
.seq{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;margin:8px 0}
.seq span{background:var(--teal);color:#fff;border-radius:10px;padding:6px 10px;font-size:.88rem;font-weight:600}
.scale{display:flex;gap:6px;margin:6px 0 14px}
.scale button{flex:1;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 2px;font:600 .78rem 'Public Sans',sans-serif;cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.chk{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px;font:500 .95rem 'Public Sans',sans-serif;cursor:pointer}
.chk[aria-pressed="true"]{border-color:var(--teal);background:var(--tint)}
ul.bl{margin:6px 0 0;padding-left:20px}ul.bl li{margin:4px 0;font-size:.95rem}
.opt.ok:disabled{opacity:1}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mx .opt{font-size:.85rem;padding:10px;margin-bottom:8px}
.mf{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mf .opt{text-align:center;font-weight:700}
.gh{margin:16px 0 6px;font:700 1rem 'Bricolage Grotesque',sans-serif;color:var(--teal-d)}
.mi{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.mi b{display:block;font-size:.95rem}.mi span{display:block;font-size:.85rem;color:var(--muted)}
.hb{flex:none;border:1.5px solid var(--accent);background:transparent;color:var(--redt);border-radius:20px;padding:4px 10px;font:600 .85rem 'Public Sans',sans-serif;cursor:pointer}
.hb[aria-pressed="true"]{background:var(--red);color:#fff;border-color:var(--red)}
.sr{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:500 1rem 'Public Sans',sans-serif;margin-bottom:8px}
.sec{margin:18px 0 8px;font:700 1rem 'Bricolage Grotesque',sans-serif;color:var(--muted)}
.small a{color:var(--teal-d);font-weight:600}
.brand{display:flex;align-items:center;gap:14px;margin:0 0 12px}
.logo{height:104px;width:auto;border-radius:14px;background:#fff;padding:6px;border:1px solid var(--line);flex:none}
.brand p{margin:0;font-weight:700;color:var(--redt);font-size:1rem;line-height:1.3}
.hero .brand{flex-direction:column;gap:8px;text-align:center}
.pil{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.pc{display:inline-flex;align-items:center;gap:6px;background:var(--tint);color:var(--teal-d);border-radius:20px;padding:3px 10px;font:700 .78rem 'Public Sans',sans-serif}
.pc:before{content:;width:8px;height:8px;border-radius:50%;background:var(--c)}
.hero .pil{justify-content:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

["You need healthcare experience before you can apply to nursing school.",false,"In most places you don't. Entry rules vary by country, and some programs want science or math prerequisites, but starting from zero is common."],

["Nurses just follow doctors' orders.",false,"Nurses assess patients, make care decisions within their scope, teach, coordinate care and speak up for patients."],
["Nursing jobs exist only in hospitals.",false,"Nurses work in clinics, schools, homes, communities, universities, research centers, tech companies and government."],
["You have to be a science genius to become a nurse.",false,"You'll learn the science in your program. Communication, observation, teamwork and persistence matter just as much."],
["Many people become nurses as a second career, at many different ages.",true,"Career changers are common. Some programs are designed for people who already have another degree or work experience."],
["Nurses can move between specialties and tracks during a career.",true,"You might start at the bedside and later move into teaching, research, leadership, policy or technology."],
["Looking after yourself is part of being a good nurse.",true,"Nursing can be demanding. Sleep, support and boundaries help nurses stay well and stay in the job."]
];
const FQ=[
{q:"Why does nursing interest you?",o:[["I like helping people directly",["care"]],["A stable career with many options",["practical"]],["I'm curious about health and the body",["curious"]],["Someone or something inspired me",["care"]]]},
{q:"A friend is upset. You usually…",o:[["Listen and stay with them",["care","calm"]],["Help find a practical solution",["practical","team"]],["Feel nervous but try to help",["care"]]]},
{q:"How do you feel about science subjects like biology?",o:[["I enjoy them",["curious"]],["Fine, if I have time to learn",["learn"]],["I'm worried I'm not good at them",["scienceWorry"]]]},
{q:"How would you handle blood, injuries or medical situations?",o:[["Pretty calmly",["calm"]],["A bit nervous, but willing to try",["squeamish"]],["I'm not sure yet",["squeamish"]]]},
{q:"What does your life allow right now?",o:[["I can study full-time",["fulltime"]],["I need to keep working while I study",["needsWork"]],["Money is my biggest worry",["needsMoney"]]]},
{q:"How do you feel about busy days and shift work?",o:[["Fine, even exciting",["team"]],["I'd prefer regular hours",["regular"]],["I'm not sure yet",["regular"]]]},
{q:"How do you prefer to learn?",o:[["By doing and practicing",["handson"]],["By reading and studying",["curious"]],["By talking with people",["team"]]]}
];
const STR={care:"You're motivated by caring for people, which is the heart of nursing.",calm:"Staying calm for others is a valuable skill in tense moments.",practical:"A practical mindset helps you organize care and solve problems.",curious:"Curiosity will help you learn health science and keep growing.",team:"You're comfortable with teamwork and busy settings.",handson:"You learn by doing, and nursing training includes plenty of supervised hands-on practice."};
const EXP={scienceWorry:"Try a free beginner biology or health lesson before applying. Many programs offer foundation or bridging options.",learn:"Look for programs with tutoring, study support and foundation modules.",squeamish:"Volunteer or shadow in a care setting. Comfort grows with exposure, and many roles involve little blood.",needsWork:"Look at part-time, evening or distance programs, or work as a healthcare assistant while you study.",needsMoney:"Research scholarships, grants, employer support and public funding in your country.",regular:"Explore community, school, clinic, education, informatics or policy roles, which often have more regular hours."};
const PLAN=[["Weeks 1 to 2",[["a1","Talk to a working nurse (a friend, family member or online community)"],["a2","Read about at least 3 nursing areas in the Career Map"]]],["Weeks 3 to 6",[["b1","Find your country's nursing council and read the entry requirements"],["b2","Volunteer or shadow in a care setting, such as a clinic, care home or charity"],["b3","Try a free beginner health or biology lesson online"]]],["Weeks 7 to 12",[["c1","Shortlist 3 nursing programs and note costs, deadlines and prerequisites"],["c2","Make a funding plan: savings, scholarships, part-time work"],["c3","Choose your starting route (see below)"],["c4","Book information sessions or start applications"]]]];
const ROUTES=[["Healthcare assistant or nursing aide job","Weeks to months. A paid way to test care work."],["Nursing diploma or associate degree","Often about 2 years in many countries."],["Bachelor's degree in nursing","Often 3 to 4 years."],["Graduate-entry or accelerated program","For people who already have a degree. Often 1 to 2 years in some countries."],["Bridging or foundation course","Helps if you need science or other prerequisites."]];
const JG=[["Shift","A block of working time, such as 8 or 12 hours, including nights and weekends."],["Ward / unit","A section of a hospital for a type of patient, like pediatrics or surgery."],["Clinical placement","Supervised hands-on practice in real care settings during your training."],["Preceptor","An experienced nurse who guides a student or new nurse."],["Registration / licensure","Official permission to work as a nurse, given by a regulator."],["Regulator / nursing council","The official body that sets standards and registers nurses."],["NCLEX","The nursing licensing exam used in the US and Canada."],["Scope of practice","What a nurse is legally allowed to do."],["Triage","Sorting patients by how urgent their need is."],["Vital signs","Pulse, breathing rate, temperature, blood pressure and oxygen level."],["Handover","Passing patient information to the next team."],["Care plan","A written plan for a patient's care and goals."],["Health record / chart","The written or digital record of a patient's care."],["Bedside nursing","Direct, hands-on care of patients."],["Charge nurse","A nurse who leads a shift or unit."],["Specialty","A focused area of nursing, like ICU or pediatrics."],["Nurse practitioner","An advanced nurse who can diagnose and treat in many countries."],["Midwife","A professional who supports pregnancy, birth and newborn care."],["Healthcare assistant (HCA / CNA)","Helps nurses with daily care tasks."],["Rounds","A regular check of patients by the care team."],["Infection control","Practices that stop germs from spreading."],["PRN","Short for 'as needed'. Used for some medicines and for flexible work."],["Evidence-based practice","Using research and experience to choose the best care."],["Continuing education","Ongoing learning after you qualify."],["Prerequisites","Courses or grades required before you can apply."],["Accelerated program","A faster program for people who already have a degree."]];
let gt='rc',ri=0,rsc=0,fa=[],fshow=false,sck={},jq='';
try{sck=JSON.parse(localStorage.getItem('nd_start')||'{}')||{}}catch(e){}
function beginV(){
 clearInterval(timer);
 const tabs=[['rc','🧐 Reality check'],['fit','🧭 Is it for me?'],['plan','📅 First 90 days'],['jar','📖 Jargon buster']];
 app.innerHTML=`<div class="brand"><img class="logo" src="${LOGO}" alt="NurseNovate logo"><p>${TAGLINE}</p></div><h2 style="margin-bottom:6px">🌱 The Quest: New to Nursing</h2>
 <p class="muted" style="margin:0 0 12px">New to nursing? You don't need any experience to explore. Take your time. There are no wrong answers.</p>
 <div class="tabs">${tabs.map(t=>`<button data-t="${t[0]}" aria-selected="${t[0]===gt}">${t[1]}</button>`).join('')}</div><div id="gb" style="margin-top:12px"></div>${foot()}`;
 app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{gt=b.dataset.t;beginV()});
 ({rc:rcV,fit:fitV,plan:planV,jar:jarV})[gt]();
}
function rcV(){
 const b=$('gb');
 if(ri>=RC.length){
  b.innerHTML=`<div class="card res"><div class="big">🎉</div><h2>${rsc}/${RC.length} right</h2><p class="muted">Nursing is more open and varied than most people expect.</p><button class="btn block" id="n1">Next: Is nursing for me?</button><button class="btn ghost block" id="r1">Play again</button></div>`;
  $('n1').onclick=()=>{gt='fit';beginV()};$('r1').onclick=()=>{ri=0;rsc=0;beginV()};return}
 const [q,f,x]=RC[ri];
 b.innerHTML=`<div class="prog"><i style="width:${ri/RC.length*100}%"></i></div><div class="card"><span class="tag">Myth or fact? ${ri+1}/${RC.length}</span><div class="q" style="margin-top:10px">${q}</div>
 <div class="mf"><button class="opt" data-v="0">❌ Myth</button><button class="opt" data-v="1">✅ Fact</button></div><div id="fb"></div></div>`;
 const bs=[...b.querySelectorAll('.opt')];
 bs.forEach(o=>o.onclick=()=>{const ok=(o.dataset.v==='1')===f;if(ok)rsc++;bs.forEach(y=>y.disabled=true);o.classList.add(ok?'ok':'bad');
  bs.find(y=>(y.dataset.v==='1')===f).classList.add('ok');
  $('fb').innerHTML=`<div class="ins">${ok?'✅':'💡'} ${x}</div><button class="btn block" id="nx2">${ri+1>=RC.length?'See results':'Next'}</button>`;
  $('nx2').onclick=()=>{ri++;rcV()}});
}
function fitV(){
 const b=$('gb');
 if(fshow)return fitRes(b);
 b.innerHTML=`<div class="card"><h3>Is nursing for me?</h3><p class="muted" style="margin:6px 0 12px">This isn't a test. It shows your starting strengths and what to explore.</p>
 ${FQ.map((f,i)=>`<div><b style="font-size:.95rem">${i+1}. ${f.q}</b><div style="margin:6px 0 12px">${f.o.map((o,n)=>`<button class="chk" data-q="${i}" data-n="${n}" aria-pressed="${fa[i]===n}"><span>${fa[i]===n?'●':'○'}</span><span>${o[0]}</span></button>`).join('')}</div></div>`).join('')}
 <button class="btn block" id="fsee">See my starting profile</button></div>`;
 b.querySelectorAll('.chk').forEach(c=>c.onclick=()=>{fa[+c.dataset.q]=+c.dataset.n;fitV()});
 $('fsee').onclick=()=>{if(fa.filter(x=>x!==undefined).length<FQ.length)return toast('Answer all '+FQ.length+' questions first');fshow=true;fitV();scrollTo(0,0)};
}
function fitRes(b){
 const cnt={};fa.forEach((n,i)=>FQ[i].o[n][1].forEach(t=>cnt[t]=(cnt[t]||0)+1));
 const pos=Object.keys(cnt).filter(t=>STR[t]).sort((a,c)=>cnt[c]-cnt[a]).slice(0,3);
 const exp=Object.keys(cnt).filter(t=>EXP[t]);
 b.innerHTML=`<div class="card res"><div class="big">🌱</div><h2>Your starting profile</h2><p class="muted" style="margin:0">Everyone starts somewhere. This is a guide, not a verdict.</p></div>
 <div class="card"><h3>Your strengths</h3><ul class="bl">${(pos.length?pos.map(t=>STR[t]):["You're at the very start, and that's fine. Curiosity is enough to begin."]).map(x=>`<li>${x}</li>`).join('')}</ul></div>
 <div class="card"><h3>Things to explore</h3><ul class="bl">${exp.map(t=>`<li>${EXP[t]}</li>`).join('')}<li>Talk to a working nurse and ask what a normal week looks like.</li><li>Browse the Career Map for roles that match your interests.</li></ul></div>
 <button class="btn block" id="fp">See my first 90 days</button><button class="btn ghost block" id="fr">Retake</button>`;
 $('fp').onclick=()=>{gt='plan';beginV()};$('fr').onclick=()=>{fa=[];fshow=false;fitV()};
}
function planV(){
 const b=$('gb'),all=PLAN.flatMap(g=>g[1]),n=all.filter(i=>sck[i[0]]).length;
 b.innerHTML=`<div class="card"><h3>Your first 90 days</h3><p class="muted" style="margin:6px 0 8px">Small steps, no commitment needed. Tap to tick off. Saved on this device.</p><div class="prog"><i style="width:${n/all.length*100}%"></i></div><p class="muted" style="margin:0 0 4px">${n}/${all.length} done</p>
 ${PLAN.map(g=>`<h4 class="gh">${g[0]}</h4>${g[1].map(i=>`<button class="chk" data-id="${i[0]}" aria-pressed="${!!sck[i[0]]}"><span>${sck[i[0]]?'✅':'⬜'}</span><span>${i[1]}</span></button>`).join('')}`).join('')}</div>
 <div class="card"><h3>Routes if you're starting from zero</h3><ul class="bl">${ROUTES.map(r=>`<li><b>${r[0]}:</b> ${r[1]}</li>`).join('')}</ul><p class="small">Names, length and entry rules vary by country.</p></div>
 <div class="card"><h3>Entry steps in your region</h3><div class="pills" style="margin-top:8px">${REGIONS.map((r,i)=>`<button data-i="${i}" aria-pressed="${region===i}">${r[0]} ${r[1]}</button>`).join('')}</div><p style="margin:0;font-size:.95rem">${region===null?'Pick your region to see the usual steps.':REGIONS[region][2]}</p></div>`;
 b.querySelectorAll('.chk').forEach(c=>c.onclick=()=>{const id=c.dataset.id;sck[id]=!sck[id];try{localStorage.setItem('nd_start',JSON.stringify(sck))}catch(e){}planV()});
 b.querySelectorAll('.pills button').forEach(p=>p.onclick=()=>{region=region===+p.dataset.i?null:+p.dataset.i;planV()});
}
function jarV(){
 const b=$('gb');
 b.innerHTML=`<input class="sr" id="jq" placeholder="Search words (e.g. shift, triage)" value="${jq.replace(/"/g,'&quot;')}"><div id="jl"></div>`;
 const draw=()=>{const q=jq.trim().toLowerCase(),it=JG.filter(([t,m])=>!q||(t+' '+m).toLowerCase().includes(q));
  $('jl').innerHTML=it.length?it.map(([t,m])=>`<div class="mi"><div><b>${t}</b><span>${m}</span></div></div>`).join(''):'<p class="muted">No matches.</p>'};
 $('jq').oninput=e=>{jq=e.target.value;draw()};draw();
}
beginV();
</script>
</body>
</html>
